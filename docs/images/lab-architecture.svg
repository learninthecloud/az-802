<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-label="Track 1 has logical DC01 and DC02, a management server running Windows Admin Center, a Windows client, two file and DHCP servers for DFS and DHCP failover. Workshop may combine roles.">
