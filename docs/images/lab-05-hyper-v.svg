<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Test VM moves from State A to modified State B; applying the checkpoint restores State A.">
<title>05  Hyper-V checkpoints</title>
<desc>Test VM moves from State A to modified State B; applying the checkpoint restores State A.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" viewBox="0 0 10 8" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#161616" stroke-width="1.4"/></marker></defs>
<rect width="960" height="500" fill="#FFFFFF"/>
<text x="48" y="52" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" letter-spacing="0">05  Hyper-V checkpoints</text>
<text x="48" y="77" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Create, change, restore  /  use a disposable test VM</text>
<rect x="84" y="182" width="234" height="110" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="201" y="232" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">Test VM</text><text x="201" y="257" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">State A</text>
<rect x="642" y="182" width="234" height="110" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="759" y="232" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">Test VM</text><text x="759" y="257" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">State B  /  modified</text>
<line x1="326" y1="234" x2="634" y2="234" stroke="#161616" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="219" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">Change VM state</text>
<line x1="201" y1="298" x2="201" y2="357" stroke="#161616" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="84" y="365" width="234" height="79" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="201" y="412" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">Checkpoint A</text>
<path d="M759 299 V404 H326" fill="none" stroke="#161616" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="539" y="390" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">Apply checkpoint</text>
<text x="480" y="462" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="0">Checkpoint is not a backup.</text>

</svg>