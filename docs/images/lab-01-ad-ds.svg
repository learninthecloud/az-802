<rect x="100" y="174" width="290" height="148" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="245" y="230.5" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">DC01</text><text x="245" y="255.5" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">Existing domain controller</text><text x="245" y="280.5" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">DNS  /  FSMO roles</text>
<rect x="570" y="174" width="290" height="148" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="715" y="230.5" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">DC02</text><text x="715" y="255.5" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">Additional domain controller</text><text x="715" y="280.5" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">DNS  /  SYSVOL</text>
<line x1="400" y1="224" x2="560" y2="224" stroke="#161616" stroke-width="1.5" marker-end="url(#arrow)"/>
