<text x="480" y="210" fill="#2563EB" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="12px" font-weight="400" text-anchor="middle">Replication</text>
<text x="480" y="350" fill="#171717" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="13px" font-weight="400" text-anchor="middle">Validate both directions.</text>
