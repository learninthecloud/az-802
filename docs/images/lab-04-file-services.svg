<rect x="544" y="162" width="284" height="105" rx="5" fill="#FFFFFF" stroke="#171717" stroke-width="1.2" stroke-opacity="0.75"/><text x="686" y="205" fill="#171717" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="14px" font-weight="600" text-anchor="middle">Files and folders</text><text x="686" y="230" fill="#171717" fill-opacity="0.7" font-family="Segoe UI, Arial, sans-serif" font-size="11px" font-weight="400" text-anchor="middle">NTFS permissions</text>
<path d="M274 276 V317 Q274 327 284 327 H470 V352" fill="none" stroke="#171717" stroke-width="1.4" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark-arrow)"/>
