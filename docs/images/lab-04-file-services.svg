<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Effective network access depends on both SMB share and NTFS permissions.">
<title>04  File services</title>
<desc>Effective network access depends on both SMB share and NTFS permissions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" viewBox="0 0 10 8" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#161616" stroke-width="1.4"/></marker></defs>
<rect width="960" height="500" fill="#FFFFFF"/>
<text x="48" y="52" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" letter-spacing="0">04  File services</text>
<text x="48" y="77" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Share permissions and NTFS permissions both control access</text>
<rect x="78" y="168" width="325" height="112" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="240.5" y="219" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">SMB share permissions</text><text x="240.5" y="244" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">Network share access</text>
<rect x="557" y="168" width="325" height="112" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="719.5" y="219" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">NTFS permissions</text><text x="719.5" y="244" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="0">Folder and file ACLs</text>
<path d="M241 287 V321 H470 V349" fill="none" stroke="#161616" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<path d="M718 287 V321 H490 V349" fill="none" stroke="#161616" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="356" y="355" width="248" height="72" rx="0" fill="#FFFFFF" stroke="#161616" stroke-width="1.4"/><text x="480" y="398.5" fill="#161616" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">Effective access</text>
<text x="79" y="455" fill="#666666" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Verify using two accounts:  Finance  /  Read-Write        HR  /  Read-Only</text>

