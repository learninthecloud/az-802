<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-label="Dependency-focused S2D diagram with separate DC01 for DNS and Active Directory, FS01 as the witness, and separate S2D01 S2D02 cluster nodes with storage pool.">
<title>S2D / Cluster dependency</title><desc>Dependency-focused S2D diagram with separate DC01 for DNS and Active Directory, FS01 as the witness, and separate S2D01 S2D02 cluster nodes with storage pool.</desc>
<defs><marker id="black-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" viewBox="0 0 7 6" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#171717" fill="none" stroke-width="1.1"/></marker><marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" viewBox="0 0 7 6" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#2563EB" fill="none" stroke-width="1.1"/></marker></defs>
<rect width="1100" height="630" fill="#FFFFFF"/>
<text x="48" y="48" fill="#171717" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="16px" font-weight="600" text-anchor="start">S2D / Cluster dependency</text>
<text x="48" y="72" fill="#171717" fill-opacity="0.68" font-family="Segoe UI, Arial, sans-serif" font-size="12px" font-weight="400" text-anchor="start">The S2D nodes need directory services and quorum outside the storage nodes.</text>
<text x="52" y="119" fill="#171717" fill-opacity="0.65" font-family="Segoe UI, Arial, sans-serif" font-size="12px" font-weight="400" text-anchor="start">Domain infrastructure</text>
<rect x="52" y="140" width="280" height="80" rx="5" fill="#FFFFFF" stroke="#171717" stroke-width="1.2" stroke-opacity="0.78"/><text x="66" y="167" fill="#171717" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="14px" font-weight="600" text-anchor="start">DC01</text><text x="66" y="190" fill="#171717" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="11px" font-weight="400" text-anchor="start">AD DS · DNS</text>
<rect x="384" y="140" width="300" height="80" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.78"/><text x="398" y="167" fill="#2563EB" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="14px" font-weight="600" text-anchor="start">FS01</text><text x="398" y="190" fill="#171717" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="11px" font-weight="400" text-anchor="start">File Share Witness</text>
<rect x="52" y="271" width="910" height="263" rx="7" fill="#FFFFFF" stroke="#171717" stroke-width="1.2" stroke-opacity="0.38" stroke-dasharray="5 5"/>
<text x="69" y="262" fill="#171717" fill-opacity="0.67" font-family="Segoe UI, Arial, sans-serif" font-size="12px" font-weight="400" text-anchor="start">Two-node S2D cluster</text>
<rect x="89" y="319" width="270" height="85" rx="5" fill="#FFFFFF" stroke="#171717" stroke-width="1.2" stroke-opacity="0.78"/><text x="103" y="346" fill="#171717" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="14px" font-weight="600" text-anchor="start">S2D01</text><text x="103" y="369" fill="#171717" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="11px" font-weight="400" text-anchor="start">Datacenter · data disks</text>
<rect x="443" y="319" width="270" height="85" rx="5" fill="#FFFFFF" stroke="#171717" stroke-width="1.2" stroke-opacity="0.78"/><text x="457" y="346" fill="#171717" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="14px" font-weight="600" text-anchor="start">S2D02</text><text x="457" y="369" fill="#171717" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="11px" font-weight="400" text-anchor="start">Datacenter · data disks</text>
<line x1="365" y1="360" x2="435" y2="360" stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.82" marker-end="url(#blue-arrow)"/>
<rect x="765" y="319" width="160" height="85" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.78"/><text x="779" y="346" fill="#2563EB" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="14px" font-weight="600" text-anchor="start">Pool / Volume</text><text x="779" y="369" fill="#171717" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="11px" font-weight="400" text-anchor="start">S2D · CSV</text>
<path d="M721 366 H757" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.82" marker-end="url(#blue-arrow)"/>
<path d="M198 229 V300" fill="none" stroke="#171717" stroke-width="1.3" stroke-opacity="0.82" stroke-dasharray="5 5" marker-end="url(#black-arrow)"/>
<path d="M532 229 V279 H554 V309" fill="none" stroke="#2563EB" stroke-width="1.3" stroke-opacity="0.82" stroke-dasharray="5 5" marker-end="url(#blue-arrow)"/>
<text x="570" y="276" fill="#171717" fill-opacity="1" font-family="Segoe UI, Arial, sans-serif" font-size="[object Object]px" font-weight="400" text-anchor="start">quorum</text>
<text x="52" y="582" fill="#171717" fill-opacity="0.7" font-family="Segoe UI, Arial, sans-serif" font-size="12px" font-weight="400" text-anchor="start">Witness lives on FS01; it is not an S2D data node. This is an evaluation lab, not physical-host HA.</text>
</svg>